<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/historial.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
    <script th:src="@{/javascript/utils.js}"></script>

    <title>Historial de Movimientos</title>
</head>

<body>

    <div th:replace="fragmentos/nav :: navbar('/historial')"></div>

    <main class="container">

        <div class="row mt-4">
            <div class="col-5">
                <h1 class="fw-bold fs-5">Historial de Ingresos y Salidas</h1>
                <p>Listado general y archivo de los movimientos de estacionamiento</p>
            </div>
        </div>

        <div class="card shadow mb-4">

            <div class="card-body">

                <form th:action="@{/filtrar}" method="get">

                    <div class="row align-items-center">

                        <div class="col-3 buscador ">
                            <div class="position-relative">
                                <input type="text" class="form-control ps-5 rounded-pill" placeholder="Buscar..."
                                    name="dni">
                                <i
                                    class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 "></i>
                            </div>
                        </div>


                        <div class="col-2 d-flex align-items-center me-5 ">
                            <label for="fechaInicio">Desde</label>
                            <div class="position-relative">
                                <input type="date" class="form-control ms-1" id="fechaInicio" name="desde">
                            </div>
                        </div>

                        <div class="col-2 d-flex align-items-center me-3">
                            <label for="fechaFin">Hasta</label>
                            <div class="position-relative">
                                <input type="date" class="form-control ms-1" id="fechaFin" name="hasta">
                            </div>
                        </div>




                        <div class="col-1">
                            <button type="submit" class="btn btn-secondary">Filtrar</button>
                        </div>

                        <div class="col-3 text-end">
                            <a th:href="@{/reportes/movimientos/pdf(
                                desde=${desde},
                                hasta=${hasta},
                                placa=${placa},
                                dni=${dni})}">
                                <i class="fa-solid fa-file-pdf fs-4"></i>
                            </a>
                        </div>

                    </div>

                </form>




            </div>
        </div>



        <div class="row">
            <div class="col-12">
                <table class="table table-hover table-active table-bordered border-primary">
                    <thead>
                        <tr>
                            <th scope="col">Placa</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Modelo</th>
                            <th scope="col">Color</th>
                            <th scope="col">Propietario</th>
                            <th scope="col">Fecha Ingreso</th>
                            <th scope="col">Fecha Salida</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="movimiento : ${movimientos}">
                            <td th:text="${movimiento.vehiculo.placa} ? ${movimiento.vehiculo.placa} : 'N/A' "></td>
                            <td th:text="${movimiento.vehiculo.tipo}"></td>
                            <td th:text="${movimiento.vehiculo.marca}"></td>
                            <td th:text="${movimiento.vehiculo.modelo}"></td>
                            <td th:text="${movimiento.vehiculo.color}"></td>
                            <td
                                th:text="${movimiento.vehiculo.propietario.nombres} + ' ' + ${movimiento.vehiculo.propietario.primerApellido}">
                                @mdo</td>
                            <td th:text="${#temporals.format(movimiento.fechaIngreso, 'dd/MM/yyyy - HH:mm')}"></td>

                            <td th:text="${#temporals.format(movimiento.fechaSalida, 'dd/MM/yyyy - HH:mm')}"></td>
                            <td th:text="${movimiento.estado}"></td>

                        </tr>

                    </tbody>

                </table>

                <nav class="pagination d-flex justify-content-center" aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${movimientos.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/historial(pagina=${movimientos.number - 1})}"
                                aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, movimientos.totalPages - 1)}"
                            th:classappend="${i == movimientos.number} ? 'active'">
                            <a class="page-link" th:href="@{/historial(pagina=${i})}" th:text="${i + 1}"></a>
                        </li>

                        <!-- Siguiente -->
                        <li class="page-item" th:classappend="${movimientos.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/historial(pagina=${movimientos.number + 1},
                             desde=${desde}, hasta=${hasta},
                             placa=${placa}, dni=${dni})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>
</body>

</html>
