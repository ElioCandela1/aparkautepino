<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/crear-usuario.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Crear Usuarios</title>
</head>

<body>
    <div th:replace="fragmentos/nav :: navbar('/gestion-usuarios')"></div>
    <main class="container">

        <div class="row mt-4">
            <div class="col-12">
                <h1 class="fw-bold fs-5">Registrar Usuario</h1>
                <p>Complete los datos del nuevo usuario para dar acceso</p>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-7 ">
                <div class="card shadow px-4 py-3">
                    <div class="card-body ">
                        <form th:action="@{/guardarUsuario}" method="post">
                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label for="nombre" class="form-label">Nombres</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required
                                        placeholder="ej. Juan Manuel">
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label for="primerApellido" class="form-label">Primer Apellido</label>
                                    <input type="text" class="form-control" id="primerApellido" name="primerApellido"
                                        required placeholder="ej. Perez">
                                </div>
                            </div>

                            <div class="row d-flex align-items-end">
                                <div class="mb-3 col-md-6">
                                    <label for="segundoApellido" class="form-label">Segundo Apellido</label>
                                    <input type="text" class="form-control" id="segundoApellido" name="segundoApellido"
                                        placeholder="ej. Castro">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <div class="input-group">
                                        <select class="form-select" name="tipoDocumento" id="tipoDocumento" required>
                                            <option value="dni">DNI</option>
                                            <option value="ce">CE</option>
                                        </select>
                                        <input type="text" class="form-control"
                                            aria-label="Text input with dropdown button" id="documentoIdentidad"
                                            name="documentoIdentidad">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label for="username" class="form-label">Nombre de Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required
                                        placeholder="ej.U23315788">
                                </div>

                                <div class="mb-3 col-md-6">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" name="password" id="password" required>
                                </div>
                            </div>

                            <div class="row d-flex align-items-end justify-content-end">
                                <div class="mb-3 col-md-6">
                                    <label for="rol" class="form-label">Rol del Sistema</label>
                                    <select class="form-select" name="rol" id="rol">
                                        <option value="ADMIN">Administrador</option>
                                        <option value="USUARIO">Usuario</option>
                                        <option value="SEGURIDAD">Seguridad</option>
                                    </select>
                                </div>

                                 <div class="col-md-3"></div>

                                <div class="mb-3  col-md-3 form-check">
                                    <div th:replace="fragmentos/toggle-button :: switch"></div>

                                </div>
                            </div>

                            <div class="mb-3 mt-5 d-flex justify-content-end">
                                <button class="btn btn-outline-secondary btn-cancelar me-2"
                                    type="reset">Cancelar</button>
                                <button class="btn btn-primary btn-guardar" type="submit">Guardar</button>
                            </div>


                        </form>
                    </div>

                </div>
            </div>
        </div>


    </main>


</body>

</html>
