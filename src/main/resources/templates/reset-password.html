<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow px-4 py-3">
                    <div class="card-body">
                        <img src="..." class="logo rounded mx-auto d-block mb-4" th:src="@{/images/logo.png}">
                        <h3 class="text-center mb-1">Restablecer Contraseña</h3>
                        <p class="text-center mb-4">Ingresa tu nueva contraseña</p>

                        <!-- Mensaje de error -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/reset-password}" method="post">

                            <!-- El token viaja oculto para que llegue al POST -->
                            <input type="hidden" name="token" th:value="${token}">

                            <div class="mb-3">
                                <label for="password" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password"
                                       name="password" required minlength="6"
                                       placeholder="Mínimo 6 caracteres">
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword"
                                       name="confirmPassword" required minlength="6"
                                       placeholder="Repite la contraseña">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-4">
                                Cambiar Contraseña
                            </button>
                        </form>

                        <footer class="footer text-center text-light">
                            &copy 2026 Proyecto Educativo. Todos los derechos reservados.
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
