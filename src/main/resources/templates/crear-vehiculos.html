<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/crear-vehiculos.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <title>Crear Vehiculos</title>

</head>

<body>

    <div th:replace="fragmentos/modales :: modales"></div>
    <div th:replace="fragmentos/nav :: navbar('/gestion-vehiculos')"></div>

    <main class="container">
        <div class="row mt-4">
            <div class="col-12">
                <h1 class="fw-bold fs-5">Registrar Vehiculos</h1>
                <p>Registrar nuevos vehiculos en el padron del estacionamiento</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow px-4 py-3">
                    <div class="card-body">
                        <form th:action="@{/guardar-vehiculo}" method="post" th:object="${vehiculo}">
                            <input type="hidden" th:field="*{id}">

                            <div class="row">
                                <div class="mb-3 col-md-6">
                                    <label for="tipoVehiculo" class="form-label">Tipo de Vehiculo</label>
                                    <select th:field="*{tipo}" class="form-select" required>
                                        <option value="">--Elegir Vehiculo--</option>
                                        <option value="AUTOMOVIL">Auto Movil</option>
                                        <option value="MOTO">Moto</option>
                                        <option value="BICICLETA"> Bicicleta</option>
                                        <option value="SCOOTER">Scooter</option>
                                    </select>
                                </div>

                                <div class=" mb-3 col-md-6">
                                    <label for="placa" class="form-label">Número de Placa</label>
                                    <input type="text" class="form-control" th:field="*{placa}"
                                        placeholder="ej. ABC-123">
                                </div>
                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="marca" class="form-label">Marca</label>
                                    <input type="text" class="form-control" th:field="*{marca}"
                                        placeholder="ej.Chevrolet">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="modelo" class="form-label">Modelo</label>
                                    <input type="text" class="form-control" th:field="*{modelo}" placeholder="ej.Spark">
                                </div>

                            </div>

                            <div class="row">


                                <div class="col-md-6 mb-3">
                                    <label for="color" class="form-label">Color</label>
                                    <input type="text" class="form-control" th:field="*{color}"
                                        placeholder="ej. Gris Plata">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="propietario" class="form-label">Propietario</label>
                                    <input type="text" class="form-control" th:field="*{propietario.numeroDocumento}"
                                        placeholder="Ej. 12345678">
                                </div>

                            </div>

                            <div class="mb-3 mt-5 d-flex justify-content-end">
                                <button class="btn btn-outline-secondary btn-cancelar me-2"
                                    type="reset">Cancelar</button>
                                <button class="btn btn-primary btn-guardar" type="submit">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.switch-container').forEach(container => {
                const checkbox = container.querySelector('input[type="checkbox"]');
                const texto = container.querySelector('.estado-label');

                function actualizarEstado() {
                    if (checkbox.checked) {
                        texto.textContent = "Desactivar";


                    } else {
                        texto.textContent = "Activar";
                    }
                }

                actualizarEstado();
                checkbox.addEventListener('change', actualizarEstado);
            });
        });
    </script>

</body>

</html>
