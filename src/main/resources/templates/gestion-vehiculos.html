<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">

    <title>Gestion de Vehiculos</title>
</head>

<body>
    <div th:replace="fragmentos/modales :: modales"></div>
    <div th:replace="fragmentos/nav :: navbar('/gestion-vehiculos')"></div>

    <main class="container">
        <div class="row mt-4">
            <div class="col-5">
                <h1 class="fw-bold fs-5">Gestion de Vehiculos</h1>
                <p>Control de vehiculos de clientes</p>
            </div>

            <div class="col-3 buscador d-flex align-items-center justify-content-center">
                   <form th:action="@{/filtrar-vehiculos}" method="get">
                    <div class="position-relative">
                        <input type="text" class="form-control ps-5 rounded-pill" placeholder="Buscar..." name="parametro">
                        <i
                            class="fa-solid fa-magnifying-glass position-absolute top-50 start-0 translate-middle-y ms-3 "></i>
                    </div>
                    </form>
                </div>

            <div class="col-3 d-flex align-items-center justify-content-end">
                <a class="btn btn-nuevo-usuario btn-primary" href="/crear-vehiculos" role="button"><i
                        class="fa-solid fa-plus"></i> Nuevo Vehiculo</a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-hover table-active table-bordered border-primary">
                    <thead>
                        <tr>
                            <th scope="col">Placa</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Modelo</th>
                            <th scope="col">Color</th>
                            <th scope="col">Propietario</th>
                            <th scope="col">Estado</th>
                            <th class="th-acciones" scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="vehiculo : ${vehiculos}">
                            <td th:text="${vehiculo.placa == null ? 'N/A' : vehiculo.placa}"></td>
                            <td th:text="${vehiculo.tipo}"></td>
                            <td th:text="${vehiculo.marca}"></td>
                            <td th:text="${vehiculo.modelo}"></td>
                            <td th:text="${vehiculo.color}"></td>
                            <td th:text="${vehiculo.propietario.nombres} +' ' + ${vehiculo.propietario.primerApellido}">@mdo</td>
                            <td th:text="${vehiculo.activo ? 'Activo' : 'Inactivo'}"></td>
                            <td class="td-acciones text-center">
                                  <a th:href="@{/actualizar-vehiculo/{id}(id=${vehiculo.id})}" class="me-2 ">
                                    <i class="fa-solid fa-pen-to-square fs-6"></i>
                                </a>
                                <!--div class="switch-container">
                                    <label class="switch">
                                        <input type="checkbox" id="estado" th:checked="${vehiculo.activo}">
                                        <span class="slider"></span>
                                    </label>
                                    <span id="estado-texto" class="estado-label fw-lighter">Inactivo</span>
                                </div-->
                            </td>
                        </tr>
                        
                    </tbody>

                </table>

                <nav class="pagination d-flex justify-content-center" aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${vehiculos.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/historial(pagina=${vehiculos.number - 1})}"
                                aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, vehiculos.totalPages - 1)}"
                            th:classappend="${i == vehiculos.number} ? 'active'">
                            <a class="page-link" th:href="@{/gestion-vehiculos(pagina=${i})}" th:text="${i + 1}"></a>
                        </li>

                        <!-- Siguiente -->
                        <li class="page-item" th:classappend="${vehiculos.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/gestion-vehiculos(pagina=${vehiculos.number + 1})}"
                                aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  
</body>

</html>
